name: Build Stamp EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard
          pip install cairosvg pillow svg-icon-gen

      - name: Convert SVG to ICO
        run: |
          python -m svg_icon_gen icon.svg --ico-only --no-dark --out-dir .
          dir icon

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: run_all.py
          mode: onefile
          enable-plugins: tk-inter
          windows-icon-from-ico: icon/icon.ico
          include-data-dir: |
            core=core
            bot=bot
            gui=gui
          include-data-file: |
            .env=.env
            icon/icon.ico=icon.ico
          output-dir: build
          company-name: He
          product-name: Stamp
          file-version: 1.0.0.0
          product-version: 1.0.0.0
          file-description: Stamp Neon Broadcast

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stamp
          path: build/run_all.exe
          include-hidden-files: true
